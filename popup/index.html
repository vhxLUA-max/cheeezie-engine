<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cheezie Engine Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="tabs">
      <div class="tab active" data-panel="chess">Settings</div>
      <div class="tab" data-panel="load">Load</div>
      <div class="tab" data-panel="export">Export</div>
    </div>

    <div class="panel active" id="chess">
      <div class="container">
        <h1>Cheezie Engine</h1>
        <!-- REST OF ORIGINAL SETTINGS UI -->
        <div class="section-divider"><span>Coach</span></div>
      </div>
    </div>

    <div class="panel" id="load">
      <p class="panel-title">Load Settings</p>
      <p class="load-hint">
        Paste a previously exported JSON config below and click Load.
      </p>
      <textarea
        class="load-textarea"
        id="loadInput"
        placeholder='{
  "elo": 3500,
  "lines": 5,
  "depth": 10,
  "delay": 100,
  "style": "Default",
  "autoMove": false
}'></textarea>
      <div class="action-row">
        <button class="btn" id="loadBtn">Load Config</button>
        <span class="load-feedback" id="loadFeedback"></span>
      </div>
    </div>

    <div class="panel" id="export">
      <p class="panel-title">Export Settings</p>
      <p class="load-hint">
        Click Export to generate your current config as JSON.
      </p>
      <pre class="export-output" id="exportOutput"></pre>
      <div class="action-row">
        <button class="btn" id="exportBtn">Export Config</button>
        <button class="btn" id="copyBtn">Copy to Clipboard</button>
      </div>
    </div>

    <script src="chessboard/jquery-3.4.1.min.js"></script>
    <script src="chessboard/chessboard-1.0.0.js"></script>
    <script src="config.js"></script>
    <script src="variable.js"></script>
    <script src="index.js"></script>
  </body>
</html>
